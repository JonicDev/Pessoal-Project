[package]
name = "meu-caderno"
version = "1.0.0"
description = "Meu caderno: rotina, tarefas, hábitos, faculdade, metas e finanças"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
